#:schema node_modules/wrangler/config-schema.json
name = "planetary-max"
main = "src/worker.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*", "/assets/crown-cover.png"]

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"
ISOLATE_MEMORY_LIMIT_MB = "128"
RPC_URL = "https://mainnet.base.org"
USDC_CONTRACT = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
BASE_CHAIN_ID = "8453"
BASE_USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
PUBLIC_MAX_INTERNET_FREE = "true"
WALLET_MODE_DEFAULT = "opt-in"
RELEASE_ANCHOR_ID = "3c8ee1c4-79b8-4bfd-be18-430679f452f2"

[[d1_databases]]
binding = "DB"
database_name = "planetary-max-db"
database_id = "e0ebaaef-e2a0-464a-8e7a-6069053bb246"

[[kv_namespaces]]
binding = "KV_BINDING"
id = "3ecfafaa730a4ac5881fc26ad9695d54"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "3ecfafaa730a4ac5881fc26ad9695d54"

[[ratelimits]]
name = "ADMIN_LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistryDO"

[[durable_objects.bindings]]
name = "BEEMAX_SECURE_REGISTRY"
class_name = "BEEMAXSecureNodeRegistryDO"

[[durable_objects.bindings]]
name = "ADMIN_SESSIONS"
class_name = "AdminSessionDO"

[[durable_objects.bindings]]
name = "TENANT_BEEMAX_DO"
class_name = "TenantBeemaxDO"

[[migrations]]
tag = "v1-node-registry"
new_sqlite_classes = ["NodeRegistryDO"]

[[migrations]]
tag = "v2-secure-registry"
new_sqlite_classes = ["BEEMAXSecureNodeRegistryDO"]

[[migrations]]
tag = "v3-admin-sessions"
new_sqlite_classes = ["AdminSessionDO"]

[[migrations]]
tag = "v4-tenant-beemax-sqlite"
new_sqlite_classes = ["TenantBeemaxDO"]

# BEEMAX uses your Cloudflare account; no model API key is sent to browsers.
[ai]
binding = "AI"

[[ratelimits]]
name = "BEEMAX_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
